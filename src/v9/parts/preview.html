<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>v9 部件库预览 · 去塑料感验收</title>
<style>
  html,body{margin:0;height:100%;background:#070b10;color:#cfe3ef;font:13px/1.5 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  #hud{position:fixed;left:16px;top:14px;z-index:10;pointer-events:none;text-shadow:0 1px 4px #000}
  #hud b{font-size:16px;letter-spacing:.04em;color:#eaf6ff}
  #hud div{opacity:.72;margin-top:2px}
  #hud .k{color:#58e1ff}
  #stat{position:fixed;right:16px;top:14px;z-index:10;text-align:right;opacity:.8;text-shadow:0 1px 4px #000}
  #err{position:fixed;left:16px;bottom:14px;z-index:20;color:#ff6b78;white-space:pre-wrap;max-width:60vw}
</style>
</head>
<body>
<div id="hud"><b>P 部件库 · 去塑料感验收</b>
  <div><span class="k">W</span> 线框 · <span class="k">R</span> 真实尺度 · <span class="k">D</span> 统一尺度 · <span class="k">1-9</span> 单独看件 · <span class="k">0</span> 全部</div>
  <div id="mode">统一尺度 · 按包围盒归一化，便于比较倒角与材质</div>
</div>
<div id="stat"></div>
<div id="err"></div>
<script type="importmap">
{ "imports": {
  "three": "../../../node_modules/three/build/three.module.js",
  "three/addons/": "../../../node_modules/three/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createParts, CATALOG} from './index.js';

const err = (m) => { document.getElementById('err').textContent += m + '\n'; };
window.addEventListener('error', e => err(String(e.message)));

const renderer = new THREE.WebGLRenderer({antialias: true, alpha: false, preserveDrawingBuffer: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b10);
scene.fog = new THREE.Fog(0x070b10, 9, 26);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .01, 120);
camera.position.set(4.2, 3.1, 5.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .55, 0);
controls.enableDamping = true;
controls.dampingFactor = .08;
controls.minDistance = 1.2;
controls.maxDistance = 24;

// 环境反射：金属件必须有环境，不然再好的倒角也看不出来
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .85;

// 灯光：主光 + 侧逆光 + 顶光（三灯把倒角高光拉开）
const key = new THREE.DirectionalLight(0xdfefff, 3.2);
key.position.set(4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = .5; key.shadow.camera.far = 30;
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
key.shadow.bias = -.0006;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7fb6ff, 2.6); rim.position.set(-6, 3.5, -5); scene.add(rim);
const top = new THREE.DirectionalLight(0xffffff, 1.3); top.position.set(0, 9, 0); scene.add(top);
scene.add(new THREE.HemisphereLight(0x9fc6ff, 0x0a0f14, .55));

// 地面：细网格 + 柔和反光（让零件有接触感，而不是飘在黑里）
const groundMat = new THREE.MeshStandardMaterial({color: 0x0a1016, roughness: .55, metalness: .35});
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), groundMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const gridTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0)'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = 'rgba(88,225,255,.28)'; g.lineWidth = 1;
  for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * 32, 0); g.lineTo(i * 32, 256); g.stroke(); g.beginPath(); g.moveTo(0, i * 32); g.lineTo(256, i * 32); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(60, 60); return t;
})();
const gridPlane = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({map: gridTex, transparent: true, opacity: .5, depthWrite: false}));
gridPlane.rotation.x = -Math.PI / 2; gridPlane.position.y = .001; scene.add(gridPlane);

// 部件
const parts = createParts(THREE);
const built = CATALOG.map(meta => {
  const g = parts.build(meta.key);
  const box = new THREE.Box3().setFromObject(g);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  g.userData.meta = meta;
  g.userData.size = size;
  g.userData.center = center;
  return g;
});

const holder = new THREE.Group(); scene.add(holder);
const labels = [];

function labelSprite(text, sub) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(6,14,22,.72)'; g.roundRect ? (g.beginPath(), g.roundRect(6, 6, 500, 116, 14), g.fill()) : g.fillRect(6, 6, 500, 116);
  g.strokeStyle = 'rgba(88,225,255,.55)'; g.lineWidth = 2; g.strokeRect ? g.strokeRect(8, 8, 496, 112) : 0;
  g.fillStyle = '#eaf6ff'; g.font = '600 44px "Segoe UI",Arial'; g.textBaseline = 'middle';
  g.fillText(text, 26, 54);
  g.fillStyle = '#7fd5f0'; g.font = '500 30px "Segoe UI",Arial';
  g.fillText(sub, 26, 98);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: t, transparent: true, depthWrite: false, toneMapped: false}));
  s.scale.set(1.5, .375, 1);
  return s;
}

let mode = 'detail';
function layout(next = mode) {
  mode = next;
  for (const g of holder.children.slice()) holder.remove(g);
  labels.length = 0;
  const cols = 4;
  const gap = 1.85;
  built.forEach((g, i) => {
    const wrap = new THREE.Group();
    const m = g.clone(true) // 克隆共享几何，材质各自独立（避免互相影响透明度）
    wrap.add(m);
    m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    const size = g.userData.size, center = g.userData.center;
    let scale = 1;
    if (mode === 'detail') {
      scale = 1.15 / Math.max(size.x, size.y, size.z);
      m.scale.setScalar(scale);
      // 让底部落在 y=0
      m.position.set(-center.x * scale, -center.y * scale + (size.y * scale) / 2, -center.z * scale);
    } else {
      m.position.set(-center.x, -center.y + size.y / 2, -center.z);
    }
    const col = i % cols, row = Math.floor(i / cols);
    wrap.position.set((col - (cols - 1) / 2) * gap, 0, (row - 1.5) * gap * 1.05);
    holder.add(wrap);
    const lb = labelSprite(g.userData.meta.label, `${g.userData.tris.toLocaleString()} tris · ${g.userData.meta.key}`);
    lb.position.set(wrap.position.x, mode === 'detail' ? .92 : Math.max(.35, size.y * .5 + .3), wrap.position.z);
    holder.add(lb);
    labels.push(lb);
  });
  document.getElementById('mode').textContent = mode === 'detail'
    ? '统一尺度 · 按包围盒归一化，便于比较倒角与材质'
    : '真实尺度 · 4.72m 车身骨架与 180mm 控制器同场';
}
layout('detail');

// 线框切换
let wire = false;
const wireMats = [];
function setWire(on) {
  wire = on;
  holder.traverse(o => {
    if (!o.isMesh) return;
    if (on) {
      if (!o.userData._m) {
        o.userData._m = o.material;
        const m = o.material.clone(); m.wireframe = true; m.transparent = true; m.opacity = .55; m.depthWrite = false;
        o.material = m;
      }
    } else if (o.userData._m) { o.material = o.userData._m; delete o.userData._m; }
  });
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'w') setWire(!wire);
  if (k === 'r') layout('real');
  if (k === 'd') layout('detail');
  if (k === '0') { layout(mode); }
  const n = parseInt(k, 10);
  if (n >= 1 && n <= 9 && CATALOG[n - 1]) focus(CATALOG[n - 1].key);
});
function focus(key) {
  const g = built.find(b => b.userData.meta.key === key);
  if (!g) return;
  const i = built.indexOf(g);
  const cols = 4, gap = 1.85;
  const col = i % cols, row = Math.floor(i / cols);
  const x = (col - (cols - 1) / 2) * gap, z = (row - 1.5) * gap * 1.05;
  controls.target.set(x, .35, z);
  camera.position.set(x + 1.1, .95, z + 1.35);
}

// HUD 统计
const totalTris = built.reduce((a, g) => a + g.userData.tris, 0);
document.getElementById('stat').innerHTML = `三 r${THREE.REVISION} · ${built.length} 个部件<br>${totalTris.toLocaleString()} 三角面 · 预算 120,000`;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t = 0;
renderer.setAnimationLoop(() => {
  t += .016;
  controls.update();
  // 轻微环绕，让倒角高光动起来
  renderer.render(scene, camera);
  window.__ready = true;
});

// 截图辅助：window.__seek(angle) 可固定机位
window.__seek = (az = .8, el = .42, dist = 7.4) => {
  const r = dist;
  camera.position.set(Math.cos(az) * r, Math.sin(el) * r + .5, Math.sin(az) * r);
  controls.target.set(0, .45, 0);
  controls.update();
  renderer.render(scene, camera);
};
window.__layout = layout;
window.__parts = built;
</script>
</body>
</html>
